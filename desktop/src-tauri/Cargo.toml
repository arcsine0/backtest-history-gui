[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backtest_history_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# the same as the package name
name = "desktop"
path = "src/main.rs"
required-features = ["pytauri/standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# PyTauri 0.8 exhaustively maps WindowEffect. Tauri Utils 2.10 made it
# non-exhaustive, so keep the compatible Tauri pair until PyTauri is updated.
tauri = { version = "=2.9.3", features = [] }
tauri-utils = "=2.9.3"
tauri-runtime = "=2.9.2"
wry = "=0.53.4"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25" }
pytauri = { version = "0.8", features = [] }
tauri-plugin-pytauri = { version = "0.8" }
